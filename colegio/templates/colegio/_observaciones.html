<section class="tarjeta">
  <h2>Observaciones de los profesores</h2>
  <ol class="linea-tiempo">
  {% for o in observaciones %}
    <li>
      <div class="linea-tiempo__meta"><time>{{ o.fecha|date:"j \d\e F \d\e Y" }}</time><span>{{ o.profesor.usuario.nombre }} · {{ o.profesor.asignatura }}</span></div>
      <p>{{ o.contenido|linebreaksbr }}</p>
    </li>
  {% empty %}
    <li class="vacio">Aún no hay observaciones registradas.</li>
  {% endfor %}
  </ol>
</section>
